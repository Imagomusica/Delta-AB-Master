name: Build Delta AB

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-24.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target DeltaAB_VST3 dsp_tests --parallel 4

      - name: DSP measurement tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DeltaAB-VST3-${{ matrix.name }}
          path: build/DeltaAB_artefacts/Release/VST3/
